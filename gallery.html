<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>Landing Page Gallery</title>
<link rel="stylesheet" href="site/assets/fonts/fonts.css">
<style>
:root {
  --bg: #F4F2EC; --surface: #fff; --ink: #16150F; --muted: #625D52; --line: #DAD4C6; --chip: #EAE6DC;
  --ok: #0B6B4C; --bad: #B42318; --focus: #1D4ED8;
  --g-ours: #0B6B4C; --g-lead: #C2410C; --g-content: #7C3AED; --g-broker: #1D4ED8; --g-intl: #6B7280;
  --shadow: 0 1px 2px rgba(22,21,15,.08), 0 8px 24px rgba(22,21,15,.10);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15140F; --surface: #1F1E18; --ink: #F1EEE6; --muted: #A9A394; --line: #34322A; --chip: #2A2922;
    --ok: #4ADE9B; --bad: #FF8A80; --focus: #93C5FD;
    --g-ours: #4ADE9B; --g-lead: #FB923C; --g-content: #C4B5FD; --g-broker: #93C5FD; --g-intl: #A1A1AA;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15140F; --surface: #1F1E18; --ink: #F1EEE6; --muted: #A9A394; --line: #34322A; --chip: #2A2922;
  --ok: #4ADE9B; --bad: #FF8A80; --focus: #93C5FD;
  --g-ours: #4ADE9B; --g-lead: #FB923C; --g-content: #C4B5FD; --g-broker: #93C5FD; --g-intl: #A1A1AA;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- header ---------- */
.top { padding: 14px 16px 10px; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: flex-end; justify-content: space-between; }
.top h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.top p { margin: 3px 0 0; color: var(--muted); font-size: 13px; max-width: 62em; }
.top p a { color: inherit; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.seg { display: inline-flex; background: var(--chip); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
.seg .short { display: none; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.filters { padding: 0 16px 10px; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.chip span { color: var(--muted); font-weight: 500; }
.chip[aria-pressed="false"] { opacity: .45; }
.chip[aria-pressed="false"] i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
.legend { margin-left: auto; color: var(--muted); font-size: 12px; }
.legend b { font-weight: 600; }
.legend .ok { color: var(--ok); } .legend .bad { color: var(--bad); }

/* ---------- grid ---------- */
.grid { display: grid; gap: var(--gap, 8px); padding: 0 16px 16px; justify-content: center; }
.card { all: unset; box-sizing: border-box; display: flex; flex-direction: column; min-width: 0; cursor: pointer; border-radius: 8px; background: var(--surface); box-shadow: var(--shadow); overflow: hidden; position: relative; }
.card:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.card:hover .thumb img { transform: scale(1.015); }
.card.ours { box-shadow: 0 0 0 2px var(--g-ours), var(--shadow); }
.thumb { display: block; aspect-ratio: var(--ar); background: var(--chip); overflow: hidden; }
.thumb img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; transition: transform .2s; }
.thumb .none { display: grid; place-items: center; height: 100%; color: var(--muted); font-size: 11px; text-align: center; padding: 6px; }
.cap { display: block; height: var(--cap, 36px); padding: 4px 6px 0; border-top: 3px solid var(--c); overflow: hidden; }
.nm { display: block; font-weight: 700; font-size: 12px; line-height: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st { display: block; font-size: 11px; line-height: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st .ok { color: var(--ok); font-weight: 600; } .st .bad { color: var(--bad); font-weight: 600; }
.grid.compact .nm { font-size: 10.5px; line-height: 13px; }
.grid.compact .st { font-size: 9.5px; line-height: 12px; }
.grid.compact .cap { padding: 3px 4px 0; }
.sheet .controls { display: none; }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); }

/* ---------- lightbox ---------- */
dialog { border: 0; padding: 0; width: min(1240px, 96vw); height: min(920px, 94vh); max-width: none; max-height: none; border-radius: 14px; background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.35); overflow: hidden; }
dialog::backdrop { background: rgba(10,10,8,.62); }
.lb { display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); height: 100%; }
.lb-head { display: flex; gap: 10px; align-items: center; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--line); border-top: 4px solid var(--c); }
.lb-head h2 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -.01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-head .grp { font-size: 12px; color: var(--muted); white-space: nowrap; }
.lb-head .sp { flex: 1; }
.lb-head .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ib { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; height: 34px; min-width: 34px; padding: 0 10px; cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; color: var(--ink); white-space: nowrap; font-size: 13px; }
.ib .short { display: none; }
@media (max-width: 760px) { .ib .short { display: inline; } }
.ib.live { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.lb-body { display: grid; grid-template-columns: 330px minmax(0, 1fr); min-height: 0; }
.lb-mob { overflow-y: auto; background: var(--chip); border-right: 1px solid var(--line); padding: 10px; }
.lb-mob img { display: block; width: 100%; border-radius: 6px; background: var(--surface); }
.lb-mob .lbl, .lb-info .lbl { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.lb-info { overflow-y: auto; padding: 14px 18px 24px; }
.lb-info .desk { display: block; width: 100%; border-radius: 8px; border: 1px solid var(--line); margin-bottom: 14px; }
.lb-info .h1 { font-size: 18px; font-weight: 700; line-height: 1.3; margin: 0 0 6px; }
.lb-info .url { font-size: 12.5px; color: var(--muted); word-break: break-all; margin: 0 0 12px; }
.lb-info .url a { color: inherit; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 0 0 14px; }
.fact { background: var(--chip); border-radius: 8px; padding: 8px 10px; }
.fact b { display: block; font-size: 18px; }
.fact b.ok { color: var(--ok); } .fact b.bad { color: var(--bad); }
.fact span { font-size: 12px; color: var(--muted); }
.lb-info p { margin: 0 0 12px; }
.lb-info h3 { font-size: 13px; margin: 14px 0 4px; }
.lb-info ul { margin: 0; padding-left: 18px; } .lb-info li { margin: 2px 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }

@media (max-width: 760px) {
  .top { padding: 10px 12px 8px; gap: 6px; }
  .top h1 { font-size: 18px; }
  .top p { font-size: 12px; }
  .top .more, .legend .more { display: none; }
  .seg button { padding: 4px 9px; font-size: 12px; }
  .seg .long { display: none; } .seg .short { display: inline; }
  .filters { padding: 0 12px 8px; gap: 5px; }
  .chip { padding: 3px 8px; font-size: 11.5px; }
  .legend { margin-left: 0; width: 100%; font-size: 11px; }
  .grid { padding: 0 12px 12px; }
  dialog { width: 100vw; height: 100dvh; border-radius: 0; }
  .lb-body { display: block; overflow-y: auto; }
  .lb-mob { max-height: 72dvh; border-right: 0; border-bottom: 1px solid var(--line); }
  .lb-head { padding: 8px 8px 8px 12px; gap: 6px; }
  .lb-head h2 { font-size: 15px; }
  .ib .long { display: none; }
  .lb-mob img { max-width: 360px; margin: 0 auto; }
  .lb-info { overflow: visible; }
  .lb-head .grp, .lb-head .count { display: none; }
  .two { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>Landing page gallery</h1>
    <p id="sub">Our 4 samples next to every competitor page we captured. Click any page for its full mobile scroll, desktop view and notes.</p>
  </div>
  <div class="controls">
    <div class="seg" role="group" aria-label="Screenshot">
      <button data-view="m1">Mobile</button><button data-view="clean"><span class="long">Mobile, cookies closed</span><span class="short">No cookies</span></button><button data-view="d1">Desktop</button>
    </div>
    <div class="seg" role="group" aria-label="Size">
      <button data-size="fit">Fit screen</button><button data-size="large">Large</button>
    </div>
  </div>
</header>
<div class="filters" id="filters" role="group" aria-label="Show groups"></div>
<main class="grid" id="grid" aria-live="polite"></main>

<dialog id="lb" aria-labelledby="lb-title">
  <div class="lb" id="lb-root"></div>
</dialog>

<script src="research/competitors/gallery-data.js"></script>
<script>
(() => {
  const G = window.GALLERY;
  const grid = document.getElementById("grid");
  const filters = document.getElementById("filters");
  const dlg = document.getElementById("lb");
  const lbRoot = document.getElementById("lb-root");
  const groupLabel = Object.fromEntries(G.groups.map(g => [g.id, g.label]));
  const store = {
    get(k) { try { return localStorage.getItem("gallery:" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem("gallery:" + k, v); } catch (e) {} },
  };
  // ?view=m1|clean|d1&sheet=1 renders a static overview (tools/gallery_sheet.py) without touching the saved choices.
  const q = new URLSearchParams(location.search);
  const views = ["m1", "clean", "d1"];
  const state = {
    view: views.includes(q.get("view")) ? q.get("view") : views.includes(store.get("view")) ? store.get("view") : "m1",
    size: q.has("sheet") ? "fit" : store.get("size") === "large" ? "large" : "fit",
    off: new Set(q.has("sheet") ? [] : (store.get("off") || "").split(",").filter(Boolean)),
  };
  if (q.has("sheet")) document.documentElement.classList.add("sheet");
  let shown = [];

  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const kb = v => v == null ? null : v < 1000 ? `${v} KB` : `${(v / 1000).toFixed(1)} MB`;
  const tone = { fields: v => v == null ? "" : v === 1 ? "ok" : v >= 3 ? "bad" : "",
                 cookie: v => v == null ? "" : v <= 15 ? "ok" : v >= 40 ? "bad" : "",
                 kb: v => v == null ? "" : v <= 400 ? "ok" : v >= 1500 ? "bad" : "" };
  const fieldsTxt = (v, long) => v == null ? null : v === 0 ? (long ? "no form" : "0") : long ? `${v} field${v > 1 ? "s" : ""}` : String(v);

  document.getElementById("sub").innerHTML =
    `Our 4 samples next to ${G.items.length - 4} competitor pages, as a visitor from a mobile ad sees them. <span class="more">Captured ${new Date(G.captured).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" })} in a 390×844 iPhone viewport. </span>Tap any page for its full scroll, desktop view and notes.<span class="more"> Analysis: <a href="research/competitors/README.md">competitor research</a>.</span>`;

  function stats(it, long) {
    const parts = [];
    const f = fieldsTxt(it.fields, long);
    if (f != null) parts.push(`<span class="${tone.fields(it.fields)}">${f}</span>`);
    if (it.cookie != null) parts.push(`<span class="${tone.cookie(it.cookie)}">${long ? "cookies " : ""}${it.cookie}%</span>`);
    if (it.kb != null) parts.push(`<span class="${tone.kb(it.kb)}">${kb(it.kb)}</span>`);
    return parts.join(" · ") || "&nbsp;";
  }

  function renderFilters() {
    filters.innerHTML = G.groups.map(g => {
      const n = G.items.filter(i => i.group === g.id).length;
      return `<button class="chip" data-g="${g.id}" style="--c: var(--g-${g.id})" aria-pressed="${!state.off.has(g.id)}"><i></i>${esc(g.label)} <span>${n}</span></button>`;
    }).join("") +
    `<span class="legend">Under each page: <b>form fields</b> · <b>cookie banner cover</b><span class="more"> of the first screen</span> · <b>page weight</b>. <b class="ok">Green</b> = good, <b class="bad">red</b> = bad.` +
    (G.hidden && G.hidden.length ? ` <span title="${esc(G.hidden.map(h => `${h.label}: ${h.cookie}%${h.dims ? ", page dimmed" : ""}`).join(" · "))}">Left out: ${G.hidden.length} pages whose cookie popup covers half the screen or more, or dims the page.</span>` : "") +
    `</span>`;
  }

  function renderGrid() {
    shown = G.items.filter(i => !state.off.has(i.group));
    const key = "t_" + state.view;
    grid.innerHTML = shown.length ? shown.map((it, k) => {
      const src = it[key];
      const what = { m1: "mobile first screen", clean: "mobile first screen after the cookie choice", d1: "desktop first screen" }[state.view];
      return `<button class="card${it.group === "ours" ? " ours" : ""}" data-k="${k}" style="--c: var(--g-${it.group})" title="${esc(it.label)}">
        <span class="thumb">${src ? `<img src="${src}" alt="${esc(it.label)}, ${what}" decoding="async">` : `<span class="none">No ${state.view === "d1" ? "desktop" : ""} capture</span>`}</span>
        <span class="cap"><span class="nm">${esc(it.label)}</span><span class="st" data-st>${stats(it, false)}</span></span>
      </button>`;
    }).join("") : `<p class="empty">No group selected.</p>`;
    layout();
  }

  function layout() {
    const n = shown.length;
    if (!n) return;
    const ar = state.view === "d1" ? 1.6 : 390 / 844;
    const W = grid.clientWidth - 32;
    grid.style.setProperty("--ar", ar);
    let cols, w, gap;
    if (state.size === "fit") {
      gap = 8;
      const capFor = w => w < 150 ? 30 : 36;
      const H = window.innerHeight - grid.getBoundingClientRect().top - window.scrollY - 16;
      for (let c = 1; c <= n; c++) {
        const cw = (W - (c - 1) * gap) / c;
        const rows = Math.ceil(n / c);
        if (rows * (cw / ar + capFor(cw)) + (rows - 1) * gap <= H) { cols = c; w = cw; break; }
      }
      const minW = state.view === "d1" ? 150 : 78;
      if (!w || w < minW) { cols = Math.max(2, Math.floor((W + gap) / (minW + gap))); w = (W - (cols - 1) * gap) / cols; }
      w = Math.min(w, state.view === "d1" ? 520 : 260);
      grid.style.setProperty("--cap", capFor(w) + "px");
    } else {
      gap = 16;
      const target = state.view === "d1" ? 380 : 210;
      cols = Math.max(2, Math.floor((W + gap) / (target + gap)));
      if (state.view === "d1" && W < 640) cols = 1;
      w = (W - (cols - 1) * gap) / cols;
      grid.style.setProperty("--cap", "38px");
    }
    grid.style.setProperty("--gap", gap + "px");
    grid.style.gridTemplateColumns = `repeat(${cols}, ${Math.floor(w)}px)`;
    const compact = w < 150;
    grid.classList.toggle("compact", compact);
    grid.querySelectorAll("[data-st]").forEach((el, k) => { el.innerHTML = stats(shown[k], !compact); });
  }

  function syncButtons() {
    document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === state.view));
    document.querySelectorAll("[data-size]").forEach(b => b.setAttribute("aria-pressed", b.dataset.size === state.size));
  }

  // ---------- lightbox ----------
  let cur = 0;
  function open(k) {
    cur = (k + shown.length) % shown.length;
    const it = shown[cur];
    const host = it.local ? it.url : it.url.replace(/^https?:\/\//, "").replace(/\/$/, "");
    const fact = (val, label, t) => val == null ? "" : `<div class="fact"><b class="${t}">${val}</b><span>${label}</span></div>`;
    const list = (title, arr) => arr && arr.length ? `<div><h3>${title}</h3><ul>${arr.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "";
    dlg.style.setProperty("--c", `var(--g-${it.group})`);
    lbRoot.innerHTML = `
      <div class="lb-head" style="--c: var(--g-${it.group})">
        <h2 id="lb-title">${esc(it.label)}</h2><span class="grp">${esc(groupLabel[it.group])}</span>
        <span class="sp"></span><span class="count">${cur + 1} / ${shown.length}</span>
        <a class="ib live" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer"><span class="long">${it.local ? "Open sample" : "Open live page"}</span><span class="short">Open</span> ↗</a>
        <button class="ib" data-go="-1" aria-label="Previous page">←</button><button class="ib" data-go="1" aria-label="Next page">→</button>
        <button class="ib" data-close aria-label="Close">✕</button>
      </div>
      <div class="lb-body">
        <div class="lb-mob"><p class="lbl">Mobile, full page${it.local ? "" : " (after the cookie choice)"}</p>
          ${it.full ? `<img src="${it.full}" alt="${esc(it.label)}, full mobile page">` : `<img src="${it.m1}" alt="${esc(it.label)}, mobile first screen">`}</div>
        <div class="lb-info">
          <p class="lbl">Desktop, first screen</p>
          ${it.d1 ? `<img class="desk" src="${it.d1}" alt="${esc(it.label)}, desktop first screen">` : `<p class="url">No desktop capture for this page.</p>`}
          ${it.h1 ? `<p class="h1" lang="cs">“${esc(it.h1)}”</p>` : ""}
          <p class="url">${it.local ? `Local sample: <a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.url)}</a> (needs the local server)` : `<a href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">${esc(host)}</a>`} · ${esc(it.market)} · ${esc(it.type)}</p>
          <div class="facts">
            ${fact(fieldsTxt(it.fields, true), it.field_names && it.field_names.length ? esc(it.field_names.join(", ")) : "form fields", tone.fields(it.fields))}
            ${fact(it.cookie == null ? null : it.cookie + "%", `of the mobile first screen under the cookie banner${it.dims ? ", page dimmed" : ""}`, tone.cookie(it.cookie))}
            ${fact(kb(it.kb), "transferred before consent", tone.kb(it.kb))}
            ${it.threat ? `<div class="fact"><b style="font-size:14px">${esc(it.threat)}</b><span>threat to us</span></div>` : ""}
          </div>
          ${it.pitch ? `<h3>${it.local ? "What it does" : "First screen in 3 seconds"}</h3><p>${esc(it.pitch)}</p>` : ""}
          ${it.lead ? `<h3>Lead magnet</h3><p>${esc(it.lead)}</p>` : ""}
          ${it.cookie_note ? `<h3>Cookie banner</h3><p>${esc(it.cookie_note)}</p>` : ""}
          ${it.note ? `<h3>Note</h3><p>${esc(it.note)}</p>` : ""}
          ${it.parent ? `<p class="url">Another page of: ${esc(it.parent)}</p>` : ""}
          <div class="two">${list("Worth copying", it.steal)}${list("Avoid", it.avoid)}</div>
        </div>
      </div>`;
    lbRoot.querySelector(".lb-mob").scrollTop = 0;
    if (!dlg.open) dlg.showModal();
  }

  lbRoot.addEventListener("click", e => {
    const go = e.target.closest("[data-go]");
    if (go) open(cur + Number(go.dataset.go));
    if (e.target.closest("[data-close]")) dlg.close();
  });
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
  dlg.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") { e.preventDefault(); open(cur + 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); open(cur - 1); }
  });
  grid.addEventListener("click", e => { const c = e.target.closest(".card"); if (c) open(Number(c.dataset.k)); });

  document.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => {
    state.view = b.dataset.view; store.set("view", state.view); syncButtons(); renderGrid();
  }));
  document.querySelectorAll("[data-size]").forEach(b => b.addEventListener("click", () => {
    state.size = b.dataset.size; store.set("size", state.size); syncButtons(); layout();
  }));
  filters.addEventListener("click", e => {
    const c = e.target.closest(".chip");
    if (!c) return;
    const g = c.dataset.g;
    state.off.has(g) ? state.off.delete(g) : state.off.add(g);
    store.set("off", [...state.off].join(","));
    c.setAttribute("aria-pressed", !state.off.has(g));
    renderGrid();
  });
  let raf;
  window.addEventListener("resize", () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(layout); });

  renderFilters();
  syncButtons();
  renderGrid();
})();
</script>
</body>
</html>
